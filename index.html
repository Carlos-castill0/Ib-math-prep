<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e10">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Mental math trainer for investment banking interviews: percents, multiplication, fractions, CAGR, multiples, IRR, margins and paper LBO steps.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316171a'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='34' font-weight='700' text-anchor='middle' fill='%235b9cff'%3E%25%3C/text%3E%3C/svg%3E">
<title>IB Mental Math</title>
<style>
:root{
  --bg:#0d0e10; --surface:#16171a; --surface2:#1e2024; --line:#2a2d33; --line2:#363a42;
  --text:#eceef1; --text2:#c3c7ce; --muted:#9aa1ab; --faint:#858c96;
  --accent:#5b9cff; --accent-strong:#2f6fe0; --accent-soft:rgba(91,156,255,.14);
  --good:#34c77b; --good-soft:rgba(52,199,123,.12); --bad:#f06565; --bad-soft:rgba(240,101,101,.12); --warn:#f2b13c;
  --series:#3987e5; --grid:#2a2c31;
  --r:14px;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary:focus-visible{outline-color:#fff}
.wrap{max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px}
.brand{font-weight:650;letter-spacing:.01em;color:var(--text2);font-size:.95rem}
.brand b{color:var(--accent);font-weight:750}
.iconbtn{background:none;border:0;color:var(--muted);min-height:44px;min-width:44px;border-radius:10px;font-size:.95rem;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.iconbtn:hover,.iconbtn:focus-visible{color:var(--text);background:var(--surface)}
h1{font-size:1.7rem;line-height:1.2;margin:14px 0 4px;letter-spacing:-.015em}
h2{font-size:1.05rem;margin:26px 0 10px;color:var(--text2);font-weight:650;letter-spacing:.01em}
.sub{color:var(--muted);margin:0 0 18px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 10px;color:var(--text)}
.mode:hover,.mode:focus-visible{border-color:var(--line2);background:var(--surface2)}
.mode .mi{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:750;font-size:1.05rem;flex:0 0 auto}
.mode .mt{font-weight:650;font-size:1.08rem}
.mode .md{color:var(--muted);font-size:.88rem;margin-top:2px}
.mode .chev{margin-left:auto;color:var(--faint);font-size:1.3rem}
.focusline{margin-top:6px;font-size:.8rem;color:var(--text2);display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:.78rem;color:var(--text2)}
.links{display:flex;gap:8px;margin-top:6px}
.links .btn{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:1rem}
.btn:hover,.btn:focus-visible{border-color:var(--line2);background:var(--surface2)}
.btn.primary{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
.btn.primary:hover,.btn.primary:focus-visible{background:#3a7af0;border-color:#3a7af0}
.btn.ghost{background:transparent}
.btn.small{min-height:44px;padding:0 12px;font-size:.9rem;border-radius:10px}
.btn.danger{color:var(--bad)}
.lastline{margin-top:18px;color:var(--muted);font-size:.88rem;text-align:center}
/* setup rows */
.catrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;margin-bottom:8px}
.catrow.off{opacity:.55}
.cr1{display:flex;align-items:flex-start;gap:10px}
.cr1 .ci{flex:1;min-width:0}
.cname{font-weight:650}
.cex{color:var(--muted);font-size:.85rem}
.cstat{color:var(--faint);font-size:.78rem;margin-top:2px}
.cr2{display:flex;align-items:center;gap:10px;margin-top:10px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);min-width:44px;min-height:44px;border-radius:7px;font-weight:650}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.seglabel{font-size:.78rem;color:var(--faint);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr2 .btn{margin-left:auto;white-space:nowrap;flex:0 0 auto}
@media (max-width:350px){ .seglabel{display:none} }
.tog{position:relative;display:inline-block;width:46px;height:28px;flex:0 0 auto;margin-top:2px}
.tog input{position:absolute;inset:-8px;opacity:0;margin:0;cursor:pointer;width:calc(100% + 16px);height:calc(100% + 16px)}
.tog span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s;pointer-events:none}
.tog span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#c9ccd2;transition:transform .15s}
.tog input:checked + span{background:var(--accent-strong)}
.tog input:checked + span::after{transform:translateX(18px);background:#fff}
.tog input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:.82rem;color:var(--muted);margin:4px 2px 14px}
/* play */
.playtop{display:flex;align-items:center;gap:8px;min-height:44px}
.pmeta{flex:1;text-align:center;font-size:.9rem;color:var(--muted);font-weight:600}
.clock{font-family:var(--mono);color:var(--text);font-size:1.05rem;margin-left:6px}
.clock.low{color:var(--warn)}
.pscore{min-width:64px;text-align:right;font-size:.95rem;color:var(--muted);font-weight:600;padding-right:4px}
.pscore .g{color:var(--good)}
.pbar{height:3px;background:var(--surface2);border-radius:3px;overflow:hidden;margin:2px 0 14px}
.pbar div{height:100%;width:0;background:var(--accent);transition:width .25s linear}
.chiprow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pchip{display:inline-flex;gap:6px;align-items:center;font-size:.78rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skipbtn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;min-height:44px;padding:0 16px;font-size:.88rem;font-weight:600;flex:0 0 auto}
.skipbtn:hover,.skipbtn:focus-visible{color:var(--text);border-color:var(--line2)}
.prompt{font-weight:500;letter-spacing:-.01em;line-height:1.2;color:var(--text2);margin:0 0 14px;min-height:1.2em;overflow-wrap:anywhere}
.prompt .ln{display:block}
.prompt .num{color:var(--text);font-weight:700}
.prompt.s1{font-size:clamp(2.3rem,11vw,3.3rem)}
.prompt.s2{font-size:clamp(1.7rem,7.4vw,2.3rem)}
.prompt.s3{font-size:clamp(1.35rem,5.6vw,1.8rem)}
.prompt.s4{font-size:clamp(1.15rem,4.6vw,1.5rem)}
.field{position:relative}
.field input{width:100%;height:66px;background:var(--surface);border:1.5px solid var(--line2);border-radius:var(--r);padding:0 76px 0 16px;font-size:clamp(1.9rem,8vw,2.4rem);font-weight:650;color:var(--text);outline:none;font-variant-numeric:tabular-nums;caret-color:var(--accent)}
.field input:focus{border-color:var(--accent)}
.field input.shake{animation:shake .28s}
.field input.long{font-size:clamp(1.3rem,5.6vw,1.7rem)}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.adorn{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:650;font-size:1.15rem;pointer-events:none}
.irow{display:flex;gap:8px;align-items:stretch}
.irow .field{flex:1;min-width:0}
.irow .go{flex:0 0 auto;min-width:88px;min-height:66px;border-radius:var(--r);font-size:1.05rem}
.fb{margin-top:12px;min-height:0}
.fbbox{border-radius:12px;padding:10px 12px;border:1px solid var(--line);background:var(--surface)}
.fbbox.ok{border-color:rgba(52,199,123,.45);background:var(--good-soft)}
.fbbox.no{border-color:rgba(240,101,101,.45);background:var(--bad-soft)}
.fbbox.info{border-color:var(--line2)}
.fbh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-weight:650}
.fbh .st{font-weight:750}
.fbbox.ok .st{color:var(--good)} .fbbox.no .st{color:var(--bad)}
.fbh .ans{font-size:1.3rem;color:var(--text)}
.fbh .lab{color:var(--muted);font-weight:600;font-size:.85rem}
.fbyou{margin-top:2px;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.fbyou b{color:var(--bad);font-weight:650}
.fbh .t{color:var(--muted);font-weight:600;font-size:.88rem;margin-left:auto}
.fbs{margin-top:6px;color:var(--text2);font-size:.95rem;line-height:1.4}
.fbs b{color:var(--text)}
.fbhint{margin-top:6px;color:var(--faint);font-size:.78rem}
/* summary */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .tv{font-size:1.7rem;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.tile .tl{font-size:.78rem;color:var(--muted);margin-top:2px}
.best{display:inline-block;margin:10px 0 0;color:var(--warn);font-weight:650;font-size:.9rem}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th{text-align:left;font-weight:600;color:var(--faint);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;padding:6px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t th.r,table.t td.r{text-align:right}
table.t tr:last-child td{border-bottom:0}
.accbar{display:inline-block;width:42px;height:6px;border-radius:3px;background:var(--surface2);vertical-align:middle;margin-left:6px;overflow:hidden}
.accbar i{display:block;height:100%;background:var(--series);border-radius:3px}
.miss{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.miss .mq{font-weight:600}
.miss .ma{font-size:.88rem;color:var(--muted);margin-top:3px}
.miss .ma b{color:var(--text)}
.miss .mh{font-size:.9rem;color:var(--text2);margin-top:5px}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .btn{flex:1}
/* stats */
.segwide{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin:0 0 10px}
.segwide button{flex:1;border:0;background:transparent;color:var(--muted);min-height:44px;border-radius:7px;font-weight:600;font-size:.9rem}
.segwide button[aria-pressed="true"]{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px 6px;margin-bottom:10px}
.chart .ct{font-size:.85rem;color:var(--text2);font-weight:600;margin:0 4px 4px}
.chart svg{display:block;width:100%;touch-action:pan-y}
.chart .empty{color:var(--faint);font-size:.88rem;padding:28px 6px;text-align:center}
.tip{position:absolute;pointer-events:none;background:#0a0b0d;border:1px solid var(--line2);border-radius:8px;padding:6px 8px;font-size:.78rem;color:var(--text);white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.4);display:none;z-index:2}
.tip .tm{color:var(--muted)}
.sesslist{font-size:.88rem}
.datarow{display:flex;flex-wrap:wrap;gap:8px}
.datarow .btn{flex:1 1 140px}
textarea.paste{width:100%;min-height:120px;margin-top:10px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px;font:16px/1.4 var(--mono);color:var(--text)}
.warnbar{background:rgba(242,177,60,.1);border:1px solid rgba(242,177,60,.35);color:#f5cf86;border-radius:10px;padding:8px 12px;font-size:.85rem;margin:6px 0 10px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#22252b;border:1px solid var(--line2);color:var(--text);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:10;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.45)}
/* self-test */
.tst h1{font-size:1.4rem}
.tst .ok{color:var(--good)} .tst .bad{color:var(--bad)}
.tst pre{white-space:pre-wrap;word-break:break-word;font:12px/1.45 var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text2)}
.tst .ex{font-size:.85rem;border-bottom:1px solid var(--line);padding:7px 0}
.tst .ex .k{color:var(--faint);font-family:var(--mono);font-size:.75rem}
@media (min-width:600px){ .tiles.four{grid-template-columns:repeat(4,1fr)} }
/* on-screen keyboard open: tighten the play screen so feedback stays above the keypad */
body.kb .playtop{min-height:38px}
body.kb .pbar{margin-bottom:8px}
body.kb .chiprow{margin-bottom:6px}
body.kb .prompt{margin-bottom:10px}
body.kb .prompt.s1{font-size:clamp(2rem,9vw,2.6rem)}
body.kb .prompt.s2{font-size:clamp(1.5rem,6.4vw,2rem)}
body.kb .prompt.s3{font-size:clamp(1.2rem,5vw,1.55rem)}
body.kb .prompt.s4{font-size:clamp(1.05rem,4.3vw,1.3rem)}
body.kb .field input,body.kb .irow .go{height:58px;min-height:58px}
body.kb .fb{margin-top:8px}
body.kb .fbhint{display:none}
body.kb.fbtight .chiprow,body.kb.fbtight .pbar{display:none}
body.kb.fbtight .prompt{margin-bottom:8px}
body.kb.fbtight .prompt.s1{font-size:1.8rem} body.kb.fbtight .prompt.s2{font-size:1.35rem}
body.kb.fbtight .prompt.s3{font-size:1.1rem} body.kb.fbtight .prompt.s4{font-size:1rem}
body.kb.fbtight .fbs{font-size:.9rem}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<noscript><p style="padding:16px">This trainer needs JavaScript.</p></noscript>
<script>
(function () {
'use strict';

/* =====================================================================
   1. RNG + NUMBER HELPERS
   ===================================================================== */
var _rand = Math.random;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rand() { return _rand(); }
function ri(a, b) { return a + Math.floor(rand() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }
function chance(p) { return rand() < p; }
function snap(x) { return Math.round(x * 1e9) / 1e9; }
function isInt(x) { return Number.isInteger(snap(x)); }
function decimals(x) {
  var s = String(snap(x));
  if (s.indexOf('e') >= 0) return 10;
  var i = s.indexOf('.');
  return i < 0 ? 0 : s.length - i - 1;
}
function fmt(x, maxD, minD) {
  if (maxD == null) maxD = 2;
  if (minD == null) minD = 0;
  if (!isFinite(x)) return String(x);
  return snap(x).toLocaleString('en-US', { maximumFractionDigits: maxD, minimumFractionDigits: Math.min(minD, maxD) });
}
function f2(x) { return fmt(x, 2, 2); }
var SUPS = '⁰¹²³⁴⁵⁶⁷⁸⁹';
function sup(n) { return String(n).replace(/\d/g, function (c) { return SUPS[+c]; }); }
var QFR = { 0.25: '¼', 0.5: '½', 0.75: '¾' };
function mean(a) { if (!a.length) return NaN; var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s / a.length; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }

/* =====================================================================
   2. CATEGORIES
   tgt = target seconds per question at difficulty 1/2/3 (used by Weakness mode)
   ===================================================================== */
var CATS = [
  { id: 'pct',    name: 'Percent of a number',   short: 'Percent',   ex: '6% of 18,000 · 17.5% of 240',   tgt: [6, 9, 12] },
  { id: 'mult',   name: 'Multiplication',        short: 'Multiply',  ex: '47 × 6 · 38 × 24 · 45 × 8,000', tgt: [6, 10, 12] },
  { id: 'frac',   name: 'Fractions ↔ percents',  short: 'Fractions', ex: '1/8 · 5/6 · 3/7',               tgt: [5, 7, 9] },
  { id: 'cagr',   name: 'Growth & CAGR',         short: 'CAGR',      ex: '100 → 150 in 3 years',          tgt: [8, 14, 18] },
  { id: 'val',    name: 'Valuation multiples',   short: 'Multiples', ex: 'EBITDA $45M at 8.5x → EV',      tgt: [7, 10, 15] },
  { id: 'irr',    name: 'Rule of 72 / IRR',      short: 'IRR',       ex: '2x in 5 years → IRR',           tgt: [7, 10, 14] },
  { id: 'margin', name: 'Margins',               short: 'Margins',   ex: 'Revenue 320, EBITDA 56',        tgt: [7, 10, 14] },
  { id: 'lbo',    name: 'Paper LBO steps',       short: 'LBO',       ex: 'Debt paydown · MOIC',           tgt: [10, 15, 22] }
];
var CAT = {};
CATS.forEach(function (c) { CAT[c.id] = c; });
var DIFF_LABEL = ['', 'Warm-up', 'Interview', 'Stretch'];
function targetSec(cat, d) { var c = CAT[cat]; return c ? c.tgt[Math.max(0, Math.min(2, (d || 2) - 1))] : 10; }

/* =====================================================================
   3. PROBLEM FACTORY
   A problem: { cat, diff, kind, q, ans, unit, tol, tolLabel, disp, how }
   unit: ''  plain number (k/m/bn suffix scale it)
         'amt' an amount in $M implied (m suffix is a no-op, bn = x1000)
         'M'  explicit $M amount, '%', 'x', 'yrs', 'bps', '$' (per share)
   tol:  absolute tolerance in answer units
   ===================================================================== */
function dispAns(ans, unit, dec) {
  var n = fmt(ans, dec == null ? 2 : dec);
  switch (unit) {
    case '%': return n + '%';
    case 'x': return n + 'x';
    case 'M': return '$' + n + 'M';
    case 'yrs': return n + ' yrs';
    case 'bps': return n + ' bps';
    case '$': return '$' + f2(ans);
    default: return n;
  }
}
function mk(cat, diff, kind, q, ans, unit, how, o) {
  o = o || {};
  ans = snap(ans);
  return {
    cat: cat, diff: diff, kind: kind, q: q, ans: ans, unit: unit || '', how: how,
    tol: o.tol || 0, tolLabel: o.tolLabel || '', signFree: !!o.signFree,
    disp: o.disp || ((o.approx ? '≈' : '') + dispAns(ans, unit || '', o.dec))
  };
}
function tolPt(t, extra) { return assign({ tol: t, tolLabel: '±' + t + ' pt' }, extra); }
function tolRel(ans, r, extra) { return assign({ tol: Math.abs(ans) * r, tolLabel: '±' + snap(r * 100) + '%' }, extra); }
function assign(a, b) { if (b) for (var k in b) a[k] = b[k]; return a; }

/* ---------- charts (inline SVG, single series each, no dual axis) ---------- */
function drawCharts() {
  var last10 = S.db.sessions.slice(-10);
  var pts = last10.map(function (s) {
    var st = sessStats(s), d = new Date(s.start);
    return { lab: (d.getMonth() + 1) + '/' + d.getDate(), acc: st.acc * 100, avg: st.avg, partial: !!s.partial, tip: MODE_NAME[s.mode] + (s.cat ? ' · ' + CAT[s.cat].short : '') + (s.partial ? ' (ended early)' : '') + ' · ' + st.k + '/' + st.n };
  });
  lineChart(document.getElementById('chAcc'), pts.map(function (p) { return { lab: p.lab, y: p.acc, tip: p.tip, partial: p.partial, val: Math.round(p.acc) + '%' }; }), { max: 100, ticks: [0, 50, 100], fmtTick: function (v) { return v + '%'; } });
  var tp = pts.filter(function (p) { return isFinite(p.avg); });
  var mx = Math.max.apply(null, tp.map(function (p) { return p.avg; }).concat([5]));
  var step = mx > 40 ? 20 : mx > 20 ? 10 : 5, top = Math.ceil(mx * 1.15 / step) * step, ticks = [];
  for (var v = 0; v <= top; v += step) ticks.push(v);
  lineChart(document.getElementById('chTime'), pts.map(function (p) { return { lab: p.lab, y: p.avg, tip: p.tip, partial: p.partial, val: sec1(p.avg) }; }), { max: top, ticks: ticks, fmtTick: function (v) { return v + 's'; } });
}
function lineChart(el, pts, o) {
  if (!el) return;
  var old = el.querySelector('svg, .empty, .tip'); while (old) { old.remove(); old = el.querySelector('svg, .empty, .tip'); }
  var valid = pts.filter(function (p) { return isFinite(p.y); });
  if (!valid.length) { el.insertAdjacentHTML('beforeend', '<div class="empty">Finish a session to see your trend.</div>'); return; }
  var W = Math.max(240, el.clientWidth - 20), H = 150, pl = 36, pr = 40, pt = 10, pb = 22, iw = W - pl - pr, ih = H - pt - pb, n = pts.length;
  function X(i) { return pl + (n === 1 ? iw / 2 : i * iw / (n - 1)); }
  function Y(v) { return pt + ih - (Math.max(0, Math.min(o.max, v)) / o.max) * ih; }
  var g = '';
  o.ticks.forEach(function (t) {
    g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(t).toFixed(1) + '" y2="' + Y(t).toFixed(1) + '" stroke="var(--grid)" stroke-width="1"/>';
    g += '<text x="' + (pl - 6) + '" y="' + (Y(t) + 4).toFixed(1) + '" text-anchor="end" fill="var(--faint)" font-size="11">' + o.fmtTick(t) + '</text>';
  });
  var d = '', started = false;
  pts.forEach(function (p, i) { if (!isFinite(p.y)) return; d += (started ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1); started = true; });
  var dots = pts.map(function (p, i) {
    if (!isFinite(p.y)) return '';
    return p.partial
      ? '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="4" fill="var(--surface)" stroke="var(--series)" stroke-width="2"/>'
      : '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="4" fill="var(--series)" stroke="var(--surface)" stroke-width="2"/>';
  }).join('');
  var lastI = -1; pts.forEach(function (p, i) { if (isFinite(p.y)) lastI = i; });
  var lastLab = '<text x="' + (X(lastI) + 8).toFixed(1) + '" y="' + (Y(pts[lastI].y) + 4).toFixed(1) + '" fill="var(--text)" font-size="12" font-weight="600">' + esc(pts[lastI].val) + '</text>';
  var xl = '<text x="' + X(0).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + (n === 1 ? 'middle' : 'start') + '" fill="var(--faint)" font-size="11">' + esc(pts[0].lab) + '</text>' +
    (n > 1 ? '<text x="' + X(n - 1).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="end" fill="var(--faint)" font-size="11">' + esc(pts[n - 1].lab) + '</text>' : '');
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(el.querySelector('.ct').textContent) + '">' + g +

  /* --- C. generators: every category × difficulty --- */
  var seen = {};
  CATS.forEach(function (c) {
    for (var d = 1; d <= 3; d++) {
      var kinds = {};
      for (var i = 0; i < perCombo; i++) {
        var p = GENS[c.id](d), tag = c.id + ' L' + d + ' ' + p.kind + ' "' + p.q + '"';
        kinds[p.kind] = (kinds[p.kind] || 0) + 1;
        var ok = check('gen.shape', p.cat === c.id && p.diff === d && typeof p.q === 'string' && p.q.length > 0 && typeof p.how === 'string' && p.how.length > 0 && typeof p.disp === 'string', tag + ' malformed');
        if (!ok) continue;
        check('gen.noFallback', p.kind !== 'fallback', tag + ' generator exhausted its retries');
        check('gen.text', !/NaN|undefined|Infinity|null|\[object/.test(p.q + ' ' + p.how + ' ' + p.disp), tag + ' bad text: ' + p.how + ' | ' + p.disp);
        check('gen.positive', isFinite(p.ans) && p.ans > 0, tag + ' answer ' + p.ans);
        var V = VERIFY[p.kind];
        if (!check('gen.verifier', !!V, tag + ' has no verifier')) continue;
        var nums = numsIn(p.q);
        check('gen.arity', V.n < 0 || nums.length === V.n, tag + ' expected ' + V.n + ' numbers in question, found ' + nums.length + ' ' + JSON.stringify(nums));
        var exp = V.f(nums, p.q);
        check('gen.correct', near(exp, p.ans, 1e-7), tag + ' recomputed ' + exp + ' but generator says ' + p.ans);
        check('gen.acceptsDisplay', grade(p, p.disp).ok, tag + ' display "' + p.disp + '" not accepted');
        check('gen.acceptsExact', grade(p, String(p.ans)).ok && grade(p, fmt(p.ans, 6)).ok, tag + ' exact ' + p.ans + ' not accepted');
        var wrong = p.ans + Math.max(p.tol * 2, Math.abs(p.ans) * 0.01, 0.01);
        check('gen.rejectsWrong', !grade(p, String(wrong)).ok, tag + ' wrong answer ' + wrong + ' accepted (tol ' + p.tol + ')');
        if (p.tol === 0) check('gen.cleanExact', decimals(p.ans) <= 2, tag + ' exact answer has >2 decimals: ' + p.ans);
        if (p.tol > 0) check('gen.tolSane', p.tol <= Math.max(1, Math.abs(p.ans) * 0.06), tag + ' tolerance too loose: ' + p.tol);
        var hn = numsIn(p.how), lastN = hn[hn.length - 1];
        check('gen.shortcutEndsOnAnswer', isFinite(lastN) && Math.abs(lastN - p.ans) <= p.tol + 0.051 + 1e-6 * Math.abs(p.ans), tag + ' shortcut ends on ' + lastN + ', answer ' + p.ans + ' :: ' + p.how);
        check('gen.shortcutLength', p.how.length <= 170, tag + ' shortcut is ' + p.how.length + ' chars');
        var me = shortcutMathErrors(p.how);
        check('gen.shortcutMath', me.length === 0, tag + ' false step in shortcut: ' + me.join(' | ') + ' :: ' + p.how);
        if (p.kind === 'cagr.decl') check('gen.signFree', grade(p, '-' + p.ans).ok, tag + ' negative decline rejected');
        var key = c.id + d + p.kind;
        if (!seen[key]) { seen[key] = 1; R.samples.push(p); }
      }
      R.kinds[c.id + ' L' + d] = kinds;
      (EXPECTED_KINDS[c.id][d] || []).forEach(function (k) { check('gen.coverage', kinds[k] > 0, c.id + ' L' + d + ' never produced ' + k + ' in ' + perCombo + ' draws'); });
      var distinct = {};
      for (var j = 0; j < 60; j++) distinct[GENS[c.id](d).q] = 1;
      check('gen.variety', Object.keys(distinct).length >= 15, c.id + ' L' + d + ' only ' + Object.keys(distinct).length + ' distinct questions in 60 draws');
    }
  });

  /* --- D. weakness weighting --- */
  var tdb = freshDB(), t0 = 1.7e12;
  function addSess(cat, n, okRate, sec) {
    var r = []; for (var i = 0; i < n; i++) r.push({ c: cat, d: 2, ok: i < Math.round(n * okRate), t: sec * 1000 });
    tdb.sessions.push({ id: 'x' + tdb.sessions.length, mode: 'drill', cat: cat, start: t0 + tdb.sessions.length, end: t0 + tdb.sessions.length + 1, r: r });
  }
  CATS.forEach(function (c) { if (c.id !== 'cagr' && c.id !== 'pct') addSess(c.id, 30, 0.9, targetSec(c.id, 2)); });
  addSess('cagr', 20, 0.3, 40); addSess('pct', 40, 1, 2);
  var W = catWeights(tdb), wm = {}; W.forEach(function (x) { wm[x.id] = x.p; });
  check('weakness', near(sum(W.map(function (x) { return x.p; })), 1, 1e-9), 'weights sum to ' + sum(W.map(function (x) { return x.p; })));
  check('weakness', W.every(function (x) { return x.p >= 0.04 - 1e-12; }), 'a weight fell below the 4% floor');
  check('weakness', W.every(function (x) { return x.id === 'cagr' || wm.cagr > x.p; }), 'weakest category (cagr) is not weighted highest: ' + JSON.stringify(wm));
  check('weakness', W.every(function (x) { return x.id === 'pct' || wm.pct < x.p; }), 'strongest category (pct) is not weighted lowest: ' + JSON.stringify(wm));
  function addTo(db, cat, n, okRate, sec) {
    var r = []; for (var i = 0; i < n; i++) r.push({ c: cat, d: 2, ok: i < Math.round(n * okRate), t: sec * 1000 });
    if (n) db.sessions.push({ id: cat + db.sessions.length, mode: 'drill', cat: cat, start: t0 + db.sessions.length, end: t0 + db.sessions.length + 1, r: r });
  }
  var prevW = -1, mono = true, series = [];
  for (var nn = 0; nn <= 25; nn++) {
    var mdb = freshDB();
    CATS.forEach(function (c) { if (c.id !== 'lbo') addTo(mdb, c.id, 20, 0.9, targetSec(c.id, 2)); });
    addTo(mdb, 'lbo', nn, 0, targetSec('lbo', 2) * 1.5);
    var wl = catWeights(mdb).filter(function (x) { return x.id === 'lbo'; })[0].w;
    series.push(wl.toFixed(3));
    if (wl < prevW - 1e-12) mono = false; prevW = wl;
  }
  check('weakness', mono, 'weight should rise with every additional miss: ' + series.join(' '));
  var udb = freshDB();
  CATS.forEach(function (c) { if (c.id !== 'cagr' && c.id !== 'mult') addTo(udb, c.id, 20, 0.9, targetSec(c.id, 2)); });
  addTo(udb, 'cagr', 20, 0.3, targetSec('cagr', 2));
  var uw = {}; catWeights(udb).forEach(function (x) { uw[x.id] = x.p; });
  check('weakness', uw.cagr > uw.mult, 'a known-weak category (30%) should outrank an untried one: ' + JSON.stringify(uw));
  var eW = catWeights(freshDB());
  check('weakness', eW.every(function (x) { return near(x.p, 1 / CATS.length, 1e-9); }), 'empty history should give even weights');
  tdb.settings.on.mult = false;
  check('weakness', !catWeights(tdb).some(function (x) { return x.id === 'mult'; }), 'disabled category still weighted');
  var counts = {}; _rand = mulberry32(seed + 7);
  for (var i = 0; i < 4000; i++) { var id = weightedPick(W); counts[id] = (counts[id] || 0) + 1; }
  check('weakness', near(counts.cagr / 4000, wm.cagr, 0.15), 'sampling frequency ' + counts.cagr / 4000 + ' vs weight ' + wm.cagr);

  /* --- E. stats --- */
  var sdb = freshDB();
  sdb.sessions.push({ id: 'a', mode: 'sprint', start: 1, end: 2, r: [{ c: 'pct', d: 1, ok: true, t: 2000 }, { c: 'pct', d: 1, ok: false, t: 4000 }, { c: 'irr', d: 2, ok: false, t: 9000, sk: 1 }] });
  var ss = sessStats(sdb.sessions[0]);
  check('stats', ss.n === 3 && ss.k === 1 && near(ss.avg, 3, 1e-9), 'sessStats ' + JSON.stringify(ss));
  var cst = catStats(sdb, 0), pc = cst.filter(function (x) { return x.id === 'pct'; })[0], ic = cst.filter(function (x) { return x.id === 'irr'; })[0];
  check('stats', pc.n === 2 && near(pc.acc, 0.5, 1e-9) && near(pc.avg, 3, 1e-9), 'catStats pct ' + JSON.stringify(pc));
  check('stats', ic.n === 1 && ic.acc === 0 && !isFinite(ic.avg), 'skips excluded from avg time ' + JSON.stringify(ic));

  /* --- F. import / export round trip + sanitising --- */
  var a = freshDB();
  a.sessions.push({ id: 's1', mode: 'drill', cat: 'pct', start: 10, end: 11, r: [{ c: 'pct', d: 2, ok: true, t: 1000 }] });
  var exported = JSON.stringify({ app: 'ib-mental-math', v: 1, settings: a.settings, sessions: a.sessions.concat([
    { id: 's2', mode: 'sprint', start: 5, end: 6, r: [{ c: 'irr', d: 3, ok: false, t: 5000, q: '<img src=x onerror=alert(1)>' }] },
    { id: 'bad', mode: 'nope', start: 1, r: [] }, { junk: true }, { id: 's3', mode: 'weak', start: 7, r: [{ c: 'unknown', d: 1, ok: true, t: 1 }] }
  ]) });
  var b = freshDB(); b.sessions.push({ id: 's1', mode: 'drill', cat: 'pct', start: 10, end: 11, r: [{ c: 'pct', d: 2, ok: true, t: 1000 }] });
  var res = mergeImport(b, exported);
  check('import', res.added === 1 && res.dup === 1 && res.bad === 3, 'merge counts ' + JSON.stringify(res));
  check('import', b.sessions.length === 2 && b.sessions[0].id === 's2', 'merged sessions sorted by start: ' + b.sessions.map(function (s) { return s.id; }));
  check('import', mergeImport(b, 'not json').error && mergeImport(b, '{"x":1}').error, 'bad JSON should be rejected with an error');
  var arr = freshDB(), ar = mergeImport(arr, JSON.stringify([{ id: 'q', mode: 'drill', cat: 'val', start: 3, r: [{ c: 'val', d: 9, ok: 1, t: -5 }] }]));
  check('import', ar.added === 1 && arr.sessions[0].r[0].d === 2 && arr.sessions[0].r[0].t === 0 && arr.sessions[0].r[0].ok === true, 'array import + sanitising ' + JSON.stringify(arr.sessions));
  var rt = cleanDB(JSON.parse(JSON.stringify(b)));
  check('import', canon(rt.sessions) === canon(b.sessions), 'cleanDB round trip changed data');
  check('import', esc('<img src=x onerror=alert(1)>').indexOf('<') < 0, 'escaping');

  /* --- F2. two tabs: merge instead of clobber; resets win over stale tabs --- */
  function S1(id, end, imp) { var o = { id: id, mode: 'drill', cat: 'pct', start: end - 1, end: end, r: [{ c: 'pct', d: 2, ok: true, t: 1 }] }; if (imp) o.imp = imp; return o; }
  var mA = { sessions: [S1('a', 10)], settings: defaultSettings() }, dA = { sessions: [S1('a', 10), S1('b', 20)] };
  mergeDisk(mA, dA);
  check('tabs', mA.sessions.map(function (x) { return x.id; }).join() === 'a,b', 'other tab\'s session not merged: ' + mA.sessions.map(function (x) { return x.id; }));
  var mB = { sessions: [S1('old', 10), S1('imported', 10, 500)], settings: defaultSettings() }, dB = { sessions: [], resetAt: 100 };
  mergeDisk(mB, dB);
  check('tabs', mB.sessions.map(function (x) { return x.id; }).join() === 'imported' && mB.resetAt === 100, 'reset in another tab should drop stale sessions but keep later imports: ' + JSON.stringify(mB.sessions.map(function (x) { return x.id; })));
  var mC = { sessions: [], resetAt: 100, settings: defaultSettings() }, dC = { sessions: [S1('stale', 10)] };
  mergeDisk(mC, dC);
  check('tabs', mC.sessions.length === 0, 'a stale tab\'s pre-reset sessions came back');

  /* --- G. storage failure is contained --- */
  var realBackend = Store.backend, wasOk = Store.ok;
  Store.backend = function () { return { getItem: function () { throw new Error('denied'); }, setItem: function () { throw new Error('quota'); } }; };
  var threw = false, l, sv;
  try { l = Store.load(); sv = Store.save(freshDB()); } catch (e) { threw = true; }
  check('storage', !threw && l === null && sv === false, 'throwing localStorage leaked an exception or wrong result');
  Store.backend = function () { throw new Error('SecurityError'); };
  threw = false; try { l = Store.load(); } catch (e) { threw = true; }
  check('storage', !threw && l === null, 'inaccessible localStorage leaked an exception');
  Store.backend = realBackend; Store.ok = wasOk;
  check('storage', cleanDB({ sessions: 'nope', settings: { diff: { pct: 7 } } }).settings.diff.pct === 2, 'cleanDB should reset invalid difficulty');

  return R;
}

function renderSelfTest(R) {
  var secs = Object.keys(R.sections).map(function (k) { var s = R.sections[k]; return '<tr><td>' + esc(k) + '</td><td class="r ok">' + s.pass + '</td><td class="r ' + (s.fail ? 'bad' : '') + '">' + s.fail + '</td></tr>'; }).join('');
  var kinds = Object.keys(R.kinds).map(function (k) { return esc(k) + ': ' + Object.keys(R.kinds[k]).map(function (x) { return x + '×' + R.kinds[k][x]; }).join(', '); }).join('\n');
  var samples = R.samples.map(function (p) {
    return '<div class="ex"><div class="k">' + esc(p.cat + ' L' + p.diff + ' · ' + p.kind + (p.tolLabel ? ' · ' + p.tolLabel : '')) + '</div><div><b>' + esc(p.q) + '</b> → ' + esc(p.disp) + '</div><div class="muted">' + esc(p.how) + '</div></div>';
  }).join('');
  app.innerHTML = '<div class="tst"><div class="top"><div class="brand"><b>%</b> Self-test</div><a class="iconbtn" href="./">Open app</a></div>' +
    '<h1 class="' + (R.fail ? 'bad' : 'ok') + '">' + (R.fail ? '✗ ' + R.fail + ' failing check' + (R.fail === 1 ? '' : 's') : '✓ All ' + R.pass + ' checks passed') + '</h1>' +
    '<p class="muted small">Seed ' + R.seed + ' · reload with ?test&amp;seed=' + R.seed + ' to reproduce · ' + R.pass + ' passed, ' + R.fail + ' failed</p>' +
    '<div class="card" style="padding:6px 10px"><table class="t"><thead><tr><th>Section</th><th class="r">Pass</th><th class="r">Fail</th></tr></thead><tbody>' + secs + '</tbody></table></div>' +
    (R.failures.length ? '<h2>Failures</h2><pre>' + esc(R.failures.join('\n')) + '</pre>' : '') +
    '<h2>Kinds generated</h2><pre>' + kinds + '</pre><h2>One sample per kind</h2>' + samples + '</div>';
}

/* =====================================================================
   11. BOOT
   ===================================================================== */
window.__IBMM__ = { GENS: GENS, CATS: CATS, parseAnswer: parseAnswer, grade: grade, generate: generate, catWeights: catWeights, catStats: catStats, sessStats: sessStats, mergeImport: mergeImport, cleanDB: cleanDB, VERIFY: VERIFY, numsIn: numsIn, shortcutMathErrors: shortcutMathErrors, setSeed: function (s) { _rand = mulberry32(s); }, state: S };

var qs = location.search || '';
if (/[?&]test\b/.test(qs)) {
  var sm = /[?&]seed=(\d+)/.exec(qs), nm = /[?&]n=(\d+)/.exec(qs);
  var seed = sm ? +sm[1] : Math.floor(Math.random() * 1e9);
  var perCombo = nm ? Math.max(50, Math.min(20000, +nm[1])) : 1000;
  app.innerHTML = '<div class="tst"><h1>Running self-test…</h1><p class="muted">' + perCombo + ' problems per category × difficulty, seed ' + seed + '.</p></div>';
  document.title = 'SELFTEST RUNNING — IB Mental Math';
  setTimeout(function () {
    _rand = mulberry32(seed);
    var t0 = now(), R;
    try { R = runSelfTest(seed, perCombo); }
    catch (e) { R = { pass: 0, fail: 1, failures: ['self-test crashed: ' + (e && e.stack || e)], sections: { crash: { pass: 0, fail: 1 } }, seed: seed, kinds: {}, samples: [] }; }
    R.ms = Math.round(now() - t0);
    _rand = Math.random;
    window.__SELFTEST__ = { pass: R.pass, fail: R.fail, failures: R.failures, seed: R.seed, sections: R.sections, kinds: R.kinds, ms: R.ms, perCombo: perCombo };
    document.title = (R.fail ? 'SELFTEST FAIL' : 'SELFTEST PASS') + ' — IB Mental Math';
    renderSelfTest(R);
  }, 30);
} else {
  var loaded = Store.load();
  S.db = cleanDB(loaded);
  if (Store.ok && !Store.corrupt) Store.save(S.db);
  try { history.replaceState({ s: 'home' }, ''); } catch (e) { /* ignore */ }
  render();
}
})();
</script>
</body>
